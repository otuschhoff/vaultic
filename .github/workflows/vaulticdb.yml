name: vaulticdb

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/vaulticdb.yml"
      - "vaulticdb/**"
      - "internal/index/proto/**"
      - "cmd/vaulticdb-smoke/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - ".github/workflows/vaulticdb.yml"
      - "vaulticdb/**"
      - "internal/index/proto/**"
      - "cmd/vaulticdb-smoke/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vaulticdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools protobuf-compiler

      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated protobuf bindings
        run: ./vaulticdb/generate-proto.sh && git diff --exit-code -- internal/index/proto

      - name: Check and test vaulticdb
        run: cargo test --manifest-path vaulticdb/Cargo.toml

      - name: Run native SlateDB smoke test
        run: VAULTICDB_NATIVE_SMOKE=1 cargo run --manifest-path vaulticdb/Cargo.toml --quiet

      - name: Build static musl vaulticdb
        run: ./vaulticdb/build-musl.sh

      - name: Verify static daemon artifact
        run: |
          file dist/vaulticdb/linux-amd64/vaulticdb
          test "$(file dist/vaulticdb/linux-amd64/vaulticdb | grep -c 'statically linked')" -eq 1

      - name: Run musl daemon native smoke test
        run: VAULTICDB_NATIVE_SMOKE=1 dist/vaulticdb/linux-amd64/vaulticdb

      - name: Verify Unix RPC smoke test
        run: |
          cargo build --manifest-path vaulticdb/Cargo.toml --quiet
          VAULTICDB_SOCKET=/tmp/vaulticdb/ci.sock vaulticdb/target/debug/vaulticdb &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          VAULTICDB_SOCKET=/tmp/vaulticdb/ci.sock go run ./cmd/vaulticdb-smoke

      - name: Verify legacy vaultic build
        run: go build ./cmd/vaultic

      - name: Test vaultic daemon client
        run: VAULTICDB_TEST_BINARY="$PWD/vaulticdb/target/debug/vaulticdb" go test ./internal/index/daemon -race
