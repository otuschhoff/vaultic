name: vaulticdb

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/vaulticdb.yml"
      - "vaulticdb/**"
      - "internal/index/**"
      - "cmd/vaulticdb-smoke/**"
      - "cmd/vaultic/cmd_index*.go"
      - "contrib/launchd/com.vaultic.key-broker.plist"
      - "contrib/macos/vaultic-key-custodian.entitlements"
      - "contrib/systemd/vaultic-key-broker.service"
      - "Makefile"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - ".github/workflows/vaulticdb.yml"
      - "vaulticdb/**"
      - "internal/index/**"
      - "cmd/vaulticdb-smoke/**"
      - "cmd/vaultic/cmd_index*.go"
      - "contrib/launchd/com.vaultic.key-broker.plist"
      - "contrib/macos/vaultic-key-custodian.entitlements"
      - "contrib/systemd/vaultic-key-broker.service"
      - "Makefile"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-secure-enclave-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Test Secure Enclave policy and codec
        run: |
          cargo test --manifest-path vaulticdb/Cargo.toml encryption::envelope::providers::tests::macos_secure_enclave_wrap_is_authenticated_and_context_bound
          cargo test --manifest-path vaulticdb/Cargo.toml encryption::recovery_capsule::tests::mixed_two_of_four_accepts_secure_enclave_yubikey_gcp_and_offline
          go test ./internal/index/broker -run TestMacosSecureEnclave -v
          go test ./cmd/vaultic -run 'TestParseExternalPolicyMembers|TestEnrollMacosSecureEnclave' -v

      - name: Build and sign native custodian
        run: |
          cargo build --manifest-path vaulticdb/Cargo.toml --bin vaultic-key-custodian
          codesign --force --sign - --identifier com.vaultic.key-custodian \
            --entitlements contrib/macos/vaultic-key-custodian.entitlements \
            vaulticdb/target/debug/vaultic-key-custodian
          codesign --verify --strict vaulticdb/target/debug/vaultic-key-custodian
          codesign -d --entitlements :- vaulticdb/target/debug/vaultic-key-custodian 2>&1 \
            | sed -n '/^<?xml/,$p' | plutil -lint -

  vaulticdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Zig
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          install_dir="$RUNNER_TEMP/zig"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev musl-tools

      - name: Install protobuf compiler
        env:
          PROTOC_VERSION: "36.0"
          PROTOC_SHA256: bc8211ce760bd43ee21ddc145d6d9dbaeeabae205267a79d9054a240e367d4b4
        run: |
          archive="$RUNNER_TEMP/protoc.zip"
          install_dir="$RUNNER_TEMP/protoc"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip"
          echo "$PROTOC_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Verify systemd broker service
        run: |
          sudo install -D --mode=0755 /bin/true /usr/local/libexec/vaultic-key-broker
          sudo install -D --mode=0600 /dev/null /etc/vaultic/key-broker.json
          systemd-analyze verify contrib/systemd/vaultic-key-broker.service

      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated protobuf bindings
        run: ./vaulticdb/generate-proto.sh && git diff --exit-code -- internal/index/proto

      - name: Check and test vaulticdb
        run: |
          cargo fmt --manifest-path vaulticdb/Cargo.toml --check
          cargo clippy --manifest-path vaulticdb/Cargo.toml --all-targets -- \
            -D warnings \
            -A clippy::too_many_lines \
            -A clippy::cognitive_complexity \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::chunks_exact_to_as_chunks \
            -A clippy::large_enum_variant \
            -A clippy::result_large_err
          cargo clippy --manifest-path vaulticdb/Cargo.toml --lib --bins -- \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -A clippy::too_many_lines \
            -A clippy::cognitive_complexity \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::chunks_exact_to_as_chunks \
            -A clippy::large_enum_variant \
            -A clippy::result_large_err
          cargo test --manifest-path vaulticdb/Cargo.toml --all-targets

      - name: Run native SlateDB smoke test
        run: VAULTICDB_NATIVE_SMOKE=1 cargo run --manifest-path vaulticdb/Cargo.toml --quiet

      - name: Build static musl vaulticdb
        run: ./vaulticdb/build-musl.sh

      - name: Verify static daemon artifact
        run: |
          file dist/vaulticdb/linux-amd64/vaulticdb
          test "$(file dist/vaulticdb/linux-amd64/vaulticdb | grep -c 'statically linked')" -eq 1

      - name: Run musl daemon native smoke test
        run: VAULTICDB_NATIVE_SMOKE=1 dist/vaulticdb/linux-amd64/vaulticdb

      - name: Verify Unix RPC smoke test
        run: |
          cargo build --manifest-path vaulticdb/Cargo.toml --quiet
          VAULTICDB_SOCKET=/tmp/vaulticdb/ci.sock vaulticdb/target/debug/vaulticdb &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          VAULTICDB_SOCKET=/tmp/vaulticdb/ci.sock go run ./cmd/vaulticdb-smoke

      - name: Verify legacy vaultic build
        run: go build ./cmd/vaultic

      - name: Test vaultic daemon client
        run: VAULTICDB_TEST_BINARY="$PWD/vaulticdb/target/debug/vaulticdb" go test ./internal/index/daemon -race

      - name: Start MinIO for S3-compatible metadata storage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/minio" https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x "$RUNNER_TEMP/minio"
          # Single-node filesystem mode exposes each top-level directory as a
          # bucket, so creating it up front avoids installing the mc client.
          mkdir -p "$RUNNER_TEMP/minio-data/vaulticdb-ci"
          MINIO_ROOT_USER=vaulticdbci MINIO_ROOT_PASSWORD=vaulticdbci123 \
            nohup "$RUNNER_TEMP/minio" server --address 127.0.0.1:9100 "$RUNNER_TEMP/minio-data" \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9100/minio/health/live >/dev/null 2>&1; then
              echo "minio ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "minio did not become ready" >&2
          cat "$RUNNER_TEMP/minio.log" >&2
          exit 1

      # Without these the S3 tests skip silently, leaving the S3-compatible
      # metadata path unverified by automation.
      - name: Test S3-compatible metadata storage
        env:
          VAULTICDB_TEST_S3_ENDPOINT: http://127.0.0.1:9100
          VAULTICDB_TEST_S3_BUCKET: vaulticdb-ci
          AWS_ENDPOINT: http://127.0.0.1:9100
          AWS_ENDPOINT_URL: http://127.0.0.1:9100
          AWS_ACCESS_KEY_ID: vaulticdbci
          AWS_SECRET_ACCESS_KEY: vaulticdbci123
          AWS_REGION: us-east-1
          AWS_ALLOW_HTTP: "true"
        run: |
          export VAULTICDB_TEST_BINARY="$PWD/vaulticdb/target/debug/vaulticdb"
          cargo test --manifest-path vaulticdb/Cargo.toml storage::tests::s3_metadata_rebuild_destroys_rebuilds_and_reopens_encrypted_candidate -- --exact
          go test ./internal/index/daemon -run TestS3CompatibleStorageRoundTrip -v
          go test ./cmd/vaultic -run TestIndexWorkflowsS3CompatibleMetadata

      - name: Dump MinIO log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/minio.log" || true
