name: vaulticd

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/vaulticd.yml"
      - "vaulticd/**"
      - "internal/index/proto/**"
      - "cmd/vaulticd-smoke/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - ".github/workflows/vaulticd.yml"
      - "vaulticd/**"
      - "internal/index/proto/**"
      - "cmd/vaulticd-smoke/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vaulticd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools protobuf-compiler

      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated protobuf bindings
        run: ./vaulticd/generate-proto.sh && git diff --exit-code -- internal/index/proto

      - name: Check and test vaulticd
        run: cargo test --manifest-path vaulticd/Cargo.toml

      - name: Run native SlateDB smoke test
        run: VAULTICD_NATIVE_SMOKE=1 cargo run --manifest-path vaulticd/Cargo.toml --quiet

      - name: Build static musl vaulticd
        run: ./vaulticd/build-musl.sh

      - name: Verify static daemon artifact
        run: |
          file dist/vaulticd/linux-amd64/vaulticd
          test "$(file dist/vaulticd/linux-amd64/vaulticd | grep -c 'statically linked')" -eq 1

      - name: Run musl daemon native smoke test
        run: VAULTICD_NATIVE_SMOKE=1 dist/vaulticd/linux-amd64/vaulticd

      - name: Verify Unix RPC smoke test
        run: |
          cargo build --manifest-path vaulticd/Cargo.toml --quiet
          VAULTICD_SOCKET=/tmp/vaulticd/ci.sock vaulticd/target/debug/vaulticd &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          VAULTICD_SOCKET=/tmp/vaulticd/ci.sock go run ./cmd/vaulticd-smoke

      - name: Verify legacy vaultic build
        run: go build ./cmd/vaultic

      - name: Test vaultic daemon client
        run: VAULTICD_TEST_BINARY="$PWD/vaulticd/target/debug/vaulticd" go test ./internal/index/daemon -race
