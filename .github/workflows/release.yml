name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux-amd64
            rust-target: x86_64-unknown-linux-musl
          - architecture: arm64
            platform: linux-arm64
            rust-target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Zig
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          install_dir="$RUNNER_TEMP/zig"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      - name: Install protobuf compiler
        env:
          PROTOC_VERSION: "36.0"
          PROTOC_SHA256: bc8211ce760bd43ee21ddc145d6d9dbaeeabae205267a79d9054a240e367d4b4
        run: |
          archive="$RUNNER_TEMP/protoc.zip"
          install_dir="$RUNNER_TEMP/protoc"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip"
          echo "$PROTOC_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Build static Linux binaries
        run: make vaultic-${{ matrix.platform }} vaulticdb-${{ matrix.platform }}

      - name: Verify static Linux binaries
        run: |
          ./vaulticdb/verify-static-linux.sh \
            bin/${{ matrix.platform }}/vaultic \
            bin/${{ matrix.platform }}/vaulticdb \
            bin/${{ matrix.platform }}/vaultic-key-broker \
            bin/${{ matrix.platform }}/vaultic-key-custodian

      - name: Run Linux amd64 binaries
        if: matrix.architecture == 'amd64'
        run: |
          bin/${{ matrix.platform }}/vaultic version
          ./vaulticdb/smoke-static-linux.sh bin/${{ matrix.platform }}

      - name: Test generic Linux amd64 binaries across distributions
        if: matrix.architecture == 'amd64'
        run: |
          for image in almalinux:8 debian:stable-slim ubuntu:latest; do
            docker run --rm \
              --platform linux/amd64 \
              --volume "$PWD/bin/${{ matrix.platform }}:/opt/vaultic:ro" \
              --volume "$PWD/vaulticdb/smoke-static-linux.sh:/opt/smoke-static-linux.sh:ro" \
              "$image" \
              /bin/sh -c '/opt/vaultic/vaultic version && /bin/sh /opt/smoke-static-linux.sh /opt/vaultic'
          done

      - name: Package Linux binaries
        run: |
          cp LICENSE bin/${{ matrix.platform }}/LICENSE
          tar -C bin -czf "vaultic-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" "${{ matrix.platform }}"

      - name: Upload Linux release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: vaultic-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Build native macOS binaries
        run: make vaultic-macos-arm64 vaulticdb-macos-arm64

      - name: Verify and run macOS binaries
        run: |
          codesign --verify --strict bin/macos-arm64/vaultic-key-custodian
          if otool -L bin/macos-arm64/* | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "macOS release binaries link to non-system libraries" >&2
            exit 1
          fi
          bin/macos-arm64/vaultic version
          VAULTICDB_NATIVE_SMOKE=1 bin/macos-arm64/vaulticdb
          if bin/macos-arm64/vaultic-key-broker >broker.log 2>&1; then
            echo "vaultic-key-broker unexpectedly accepted an empty command line" >&2
            exit 1
          fi
          grep -q 'usage: vaultic-key-broker' broker.log

      - name: Package macOS binaries
        run: |
          cp LICENSE bin/macos-arm64/LICENSE
          tar -C bin -czf "vaultic-${{ github.ref_name }}-macos-arm64.tar.gz" macos-arm64

      - name: Upload macOS release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: vaultic-${{ github.ref_name }}-macos-arm64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows amd64 CLI (optional)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build Windows CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin/windows-amd64 | Out-Null
          go run build.go --goos windows --goarch amd64 -o bin/windows-amd64/vaultic.exe

      - name: Run Windows CLI
        shell: pwsh
        run: bin/windows-amd64/vaultic.exe version

      - name: Package Windows CLI
        shell: pwsh
        run: |
          Copy-Item LICENSE bin/windows-amd64/LICENSE
          Compress-Archive -Path bin/windows-amd64 -DestinationPath "vaultic-${{ github.ref_name }}-windows-amd64.zip"

      - name: Upload Windows release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: vaultic-${{ github.ref_name }}-windows-amd64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Require Linux and macOS archives
        run: |
          test -f "release-assets/vaultic-${{ github.ref_name }}-linux-amd64.tar.gz"
          test -f "release-assets/vaultic-${{ github.ref_name }}-linux-arm64.tar.gz"
          test -f "release-assets/vaultic-${{ github.ref_name }}-macos-arm64.tar.gz"

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Publish release archives
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true