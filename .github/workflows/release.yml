name: Build and Release Static Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Static ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            target: x86_64-unknown-linux-musl
            features: ''
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            features: ''
          - platform: linux-amd64-rados
            target: x86_64-unknown-linux-musl
            features: rados
          - platform: linux-arm64-rados
            target: aarch64-unknown-linux-musl
            features: rados
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        env:
          ZIG_VERSION: '0.16.0'
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          install_dir="$RUNNER_TEMP/zig"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install build tools
        run: |
          cargo install cargo-zigbuild --version 0.23.2 --locked
          sudo apt-get update
          sudo apt-get install --yes llvm

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"

      - name: Build static binaries
        run: |
          make vaultic-${{ matrix.platform }} vaulticdb-${{ matrix.platform }} \
            VAULTIC_BUILD_TAGS='${{ matrix.features }}' VAULTICDB_FEATURES='${{ matrix.features }}' \
            VAULTICDB_PREPARE_DEBUG=1 AR=llvm-ar OBJCOPY=llvm-objcopy

      - name: Verify static linkage and debug symbols
        run: |
          ./vaulticdb/verify-static-linux.sh bin/${{ matrix.platform }}/vaultic \
            bin/${{ matrix.platform }}/vaulticdb bin/${{ matrix.platform }}/vaultic-key-broker \
            bin/${{ matrix.platform }}/vaultic-key-custodian
          for binary in vaulticdb vaultic-key-broker vaultic-key-custodian; do
            release_id=$(llvm-readelf --notes "bin/${{ matrix.platform }}/$binary" | awk '/Build ID:/ { print $3; exit }')
            debug_id=$(llvm-readelf --notes "bin/${{ matrix.platform }}-debug/$binary.debug" | awk '/Build ID:/ { print $3; exit }')
            test -n "$release_id"
            test "$release_id" = "$debug_id"
            llvm-readelf --string-dump=.gnu_debuglink "bin/${{ matrix.platform }}/$binary" | grep -Fq "$binary.debug"
          done

      - name: Smoke test amd64 executables
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bin/${{ matrix.platform }}/vaultic version
          ./vaulticdb/smoke-static-linux.sh bin/${{ matrix.platform }}

      - name: Package binaries and dependency notices
        run: |
          cp LICENSE bin/${{ matrix.platform }}/LICENSE
          cp vaulticdb/REBUILDING.md bin/${{ matrix.platform }}/REBUILDING.md
          if test '${{ matrix.features }}' = rados; then
            cargo metadata --manifest-path vaulticdb/Cargo.toml --locked --features rados --format-version 1 > "$RUNNER_TEMP/metadata.json"
            source=$(jq -r '.packages[] | select(.name == "rados-rs") | .manifest_path' "$RUNNER_TEMP/metadata.json")
            mkdir -p bin/${{ matrix.platform }}/licenses/rados-rs
            cp "$(dirname "$source")/LICENSE" "$(dirname "$source")/THIRD_PARTY_NOTICES" \
              "$(dirname "$source")/RUST_THIRD_PARTY_NOTICES" bin/${{ matrix.platform }}/licenses/rados-rs/
          fi
          tar -C bin -czf "vaultic-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" '${{ matrix.platform }}'
          tar -C bin -czf "vaultic-${{ github.ref_name }}-${{ matrix.platform }}-debug.tar.gz" '${{ matrix.platform }}-debug'

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            vaultic-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
            vaultic-${{ github.ref_name }}-${{ matrix.platform }}-debug.tar.gz
          if-no-files-found: error

  package-source:
    name: Package Rebuildable Rust Sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor locked sources and verify offline resolution
        run: sh vaulticdb/package-source.sh "$PWD/vaultic-${{ github.ref_name }}-rust-source.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: release-rust-source
          path: vaultic-${{ github.ref_name }}-rust-source.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Static Binary Archives
    needs: [build-linux, package-source]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete static release
        run: |
          for platform in linux-amd64 linux-arm64 linux-amd64-rados linux-arm64-rados; do
            test -f "release-assets/vaultic-${{ github.ref_name }}-$platform.tar.gz"
            test -f "release-assets/vaultic-${{ github.ref_name }}-$platform-debug.tar.gz"
          done
          test -f "release-assets/vaultic-${{ github.ref_name }}-rust-source.tar.gz"
          test "$(find release-assets -type f | wc -l)" -eq 9

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          body: |
            ## Static Linux releases
            - Generic and RADOS-enabled suites for amd64 and arm64, each containing Vaultic, VaulticDB, the key broker, and the key custodian.
            - Every executable is checked for static linkage before packaging. Matching Rust debug symbols and SHA256SUMS are included.
            - No Docker images, macOS binaries, or Windows binaries are published.
            - VaulticDB now uses the pinned pure-Rust rados-rs client instead of librados. Atomic conditional writes, version-checked reads, and sealed cluster identity are preserved.
            - The Rust source archive includes vendored dependencies, licenses, and instructions for rebuilding with a modified LGPL-2.1-only RADOS client.

            ## Qualification limits
            The RADOS client's upstream release qualification remains incomplete. Static builds and offline smoke tests are not live Ceph acceptance. Compound writes are limited to 64 MiB including attributes and operation metadata; oversized writes fail rather than being split non-atomically. Production services are not automatically upgraded by this release.