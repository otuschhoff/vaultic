name: Build and Release Generic Linux Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Zig
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          install_dir="$RUNNER_TEMP/zig"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      - name: Install protobuf compiler
        env:
          PROTOC_VERSION: "36.0"
          PROTOC_SHA256: bc8211ce760bd43ee21ddc145d6d9dbaeeabae205267a79d9054a240e367d4b4
        run: |
          archive="$RUNNER_TEMP/protoc.zip"
          install_dir="$RUNNER_TEMP/protoc"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip"
          echo "$PROTOC_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Build release binaries
        run: make vaulticdb-linux-amd64

      - name: Package generic Linux binaries
        run: |
          tar -C bin -czf vaulticdb-linux-amd64.tar.gz linux-amd64

      - name: Test generic Linux binaries across distributions
        run: |
          mkdir -p "$RUNNER_TEMP/vaulticdb-release"
          tar -C "$RUNNER_TEMP/vaulticdb-release" -xzf vaulticdb-linux-amd64.tar.gz
          for image in almalinux:8 debian:stable-slim ubuntu:latest; do
            docker run --rm \
              --platform linux/amd64 \
              --volume "$RUNNER_TEMP/vaulticdb-release/linux-amd64:/opt/vaulticdb:ro" \
              --volume "$PWD/vaulticdb/smoke-static-linux.sh:/opt/smoke-static-linux.sh:ro" \
              "$image" \
              /bin/sh /opt/smoke-static-linux.sh /opt/vaulticdb
          done

      - name: Create Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: vaulticdb-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}