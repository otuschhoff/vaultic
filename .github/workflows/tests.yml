name: test
on:
  # run tests on push to main, but not when other branches are pushed to
  push:
    branches:
      - main

  # run tests for all pull requests
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  latest_go: "1.26.x"
  GO111MODULE: on

jobs:
  test:
    strategy:
      matrix:
        # list of jobs to run:
        include:
          - job_name: Windows
            go: 1.26.x
            os: windows-latest

          - job_name: macOS
            go: 1.26.x
            os: macOS-latest
            test_fuse: false

          - job_name: Linux
            go: 1.26.x
            os: ubuntu-latest
            test_cloud_backends: true
            test_fuse: true
            check_changelog: true

          - job_name: Linux (race)
            go: 1.26.x
            os: ubuntu-latest
            test_fuse: true
            test_opts: "-race"

    name: ${{ matrix.job_name }} Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}

    env:
      GOPROXY: https://proxy.golang.org

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Get programs (Linux/macOS)
        run: |
          echo "build Go tools"
          go install github.com/restic/rest-server/cmd/rest-server@master

          echo "install minio server"
          mkdir $HOME/bin
          if [ "$RUNNER_OS" == "macOS" ]; then
            wget --no-verbose -O $HOME/bin/minio https://dl.minio.io/server/minio/release/darwin-amd64/minio
          else
            wget --no-verbose -O $HOME/bin/minio https://dl.minio.io/server/minio/release/linux-amd64/minio
          fi
          chmod 755 $HOME/bin/minio

          echo "install rclone"
          if [ "$RUNNER_OS" == "macOS" ]; then
            wget --no-verbose -O rclone.zip https://downloads.rclone.org/rclone-current-osx-amd64.zip
          else
            wget --no-verbose -O rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          fi
          unzip rclone.zip
          cp rclone*/rclone $HOME/bin
          chmod 755 $HOME/bin/rclone
          rm -rf rclone*

          # add $HOME/bin to path ($GOBIN was already added to the path by setup-go@v3)
          echo $HOME/bin >> $GITHUB_PATH
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macOS-latest'

      - name: Get programs (Windows)
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          echo "build Go tools"
          go install github.com/restic/rest-server/cmd/rest-server@master

          echo "install minio server"
          mkdir $Env:USERPROFILE/bin
          Invoke-WebRequest https://dl.minio.io/server/minio/release/windows-amd64/minio.exe -OutFile $Env:USERPROFILE/bin/minio.exe

          echo "install rclone"
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rclone.zip

          unzip rclone.zip
          copy rclone*/rclone.exe $Env:USERPROFILE/bin

          # add $USERPROFILE/bin to path ($GOBIN was already added to the path by setup-go@v3)
          echo $Env:USERPROFILE\bin >> $Env:GITHUB_PATH

          echo "verify tar"
          Get-Command tar.exe -ErrorAction Stop
          tar.exe --version
        if: matrix.os == 'windows-latest'

      - name: Build with build.go
        run: |
          go run build.go

      - name: Minimal test
        timeout-minutes: 3
        run: |
          ./vaultic init
          ./vaultic backup .
        env:
          VAULTIC_REPOSITORY: ../testrepo
          VAULTIC_PASSWORD: password
          VAULTIC_DEBUG_STACKTRACE_SIGINT: "true"

      - name: Run local Tests
        env:
          VAULTIC_TEST_FUSE: ${{ matrix.test_fuse }}
        run: |
          go test -cover ${{matrix.test_opts}} ./...

      - name: Test cloud backends
        env:
          VAULTIC_TEST_S3_KEY: ${{ secrets.RESTIC_TEST_S3_KEY }}
          VAULTIC_TEST_S3_SECRET: ${{ secrets.RESTIC_TEST_S3_SECRET }}
          VAULTIC_TEST_S3_REPOSITORY: ${{ secrets.RESTIC_TEST_S3_REPOSITORY }}
          VAULTIC_TEST_AZURE_ACCOUNT_NAME: ${{ secrets.RESTIC_TEST_AZURE_ACCOUNT_NAME }}
          VAULTIC_TEST_AZURE_ACCOUNT_KEY: ${{ secrets.RESTIC_TEST_AZURE_ACCOUNT_KEY }}
          VAULTIC_TEST_AZURE_REPOSITORY: ${{ secrets.RESTIC_TEST_AZURE_REPOSITORY }}
          VAULTIC_TEST_B2_ACCOUNT_ID: ${{ secrets.RESTIC_TEST_B2_ACCOUNT_ID }}
          VAULTIC_TEST_B2_ACCOUNT_KEY: ${{ secrets.RESTIC_TEST_B2_ACCOUNT_KEY }}
          VAULTIC_TEST_B2_REPOSITORY: ${{ secrets.RESTIC_TEST_B2_REPOSITORY }}
          VAULTIC_TEST_GS_REPOSITORY: ${{ secrets.RESTIC_TEST_GS_REPOSITORY }}
          VAULTIC_TEST_GS_PROJECT_ID: ${{ secrets.RESTIC_TEST_GS_PROJECT_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.RESTIC_TEST_GS_PROJECT_ID }}
          VAULTIC_TEST_GS_APPLICATION_CREDENTIALS_B64: ${{ secrets.RESTIC_TEST_GS_APPLICATION_CREDENTIALS_B64 }}
          VAULTIC_TEST_OS_AUTH_URL: ${{ secrets.RESTIC_TEST_OS_AUTH_URL }}
          VAULTIC_TEST_OS_TENANT_NAME: ${{ secrets.RESTIC_TEST_OS_TENANT_NAME }}
          VAULTIC_TEST_OS_USERNAME: ${{ secrets.RESTIC_TEST_OS_USERNAME }}
          VAULTIC_TEST_OS_PASSWORD: ${{ secrets.RESTIC_TEST_OS_PASSWORD }}
          VAULTIC_TEST_OS_REGION_NAME: ${{ secrets.RESTIC_TEST_OS_REGION_NAME }}
          VAULTIC_TEST_SWIFT: ${{ secrets.RESTIC_TEST_SWIFT }}
        run: |
          required_tests=(
            vaultic/backend/rest.TestBackendREST
            vaultic/backend/sftp.TestBackendSFTP
            vaultic/backend/s3.TestBackendMinio
            vaultic/backend/rclone.TestBackendRclone
          )

          require_if_configured() {
            local test_name=$1
            shift
            local configured=0
            local variable

            for variable in "$@"; do
              if [[ -n "${!variable:-}" ]]; then
                configured=$((configured + 1))
              fi
            done

            if ((configured == 0)); then
              return
            fi
            if ((configured != $#)); then
              echo "incomplete credentials for ${test_name}" >&2
              return 1
            fi
            required_tests+=("$test_name")
          }

          require_if_configured vaultic/backend/s3.TestBackendS3 \
            VAULTIC_TEST_S3_KEY VAULTIC_TEST_S3_SECRET VAULTIC_TEST_S3_REPOSITORY
          require_if_configured vaultic/backend/azure.TestBackendAzure \
            VAULTIC_TEST_AZURE_ACCOUNT_NAME VAULTIC_TEST_AZURE_ACCOUNT_KEY VAULTIC_TEST_AZURE_REPOSITORY
          require_if_configured vaultic/backend/b2.TestBackendB2 \
            VAULTIC_TEST_B2_ACCOUNT_ID VAULTIC_TEST_B2_ACCOUNT_KEY VAULTIC_TEST_B2_REPOSITORY
          require_if_configured vaultic/backend/gs.TestBackendGS \
            VAULTIC_TEST_GS_PROJECT_ID VAULTIC_TEST_GS_REPOSITORY VAULTIC_TEST_GS_APPLICATION_CREDENTIALS_B64
          require_if_configured vaultic/backend/swift.TestBackendSwift \
            VAULTIC_TEST_SWIFT VAULTIC_TEST_OS_AUTH_URL VAULTIC_TEST_OS_TENANT_NAME \
            VAULTIC_TEST_OS_USERNAME VAULTIC_TEST_OS_PASSWORD VAULTIC_TEST_OS_REGION_NAME

          VAULTIC_TEST_DISALLOW_SKIP=$(IFS=,; echo "${required_tests[*]}")
          export VAULTIC_TEST_DISALLOW_SKIP

          if [[ -n "$VAULTIC_TEST_GS_APPLICATION_CREDENTIALS_B64" ]]; then
            GOOGLE_APPLICATION_CREDENTIALS=$(mktemp --tmpdir vaultic-gcs-auth-XXXXXXX)
            export GOOGLE_APPLICATION_CREDENTIALS
            trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
            printf '%s' "$VAULTIC_TEST_GS_APPLICATION_CREDENTIALS_B64" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
          fi

          go test -cover -parallel 5 -timeout 15m ./internal/backend/...

        # Run backend integrations for pull requests from and pushes to our own
        # repo. Cloud tests are enforced only for configured credential groups.
        # Skip for Dependabot pull requests as these are run without secrets
        # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#responding-to-events
        if: ((github.repository == 'otuschhoff/vaultic' && github.event_name == 'push') || github.event.pull_request.head.repo.full_name == github.repository) && (github.actor != 'dependabot[bot]') && matrix.test_cloud_backends

      - name: Check changelog files with calens
        run: |
          echo "install calens"
          go install github.com/vaultic/calens@latest

          echo "check changelog files"
          calens
        if: matrix.check_changelog

  cross_compile:
    strategy:
      matrix:
        # run cross-compile in three batches parallel so the overall tests run faster
        subset:
          - "0/3"
          - "1/3"
          - "2/3"

    env:
      GOPROXY: https://proxy.golang.org

    runs-on: ubuntu-latest

    name: Cross Compile for subset ${{ matrix.subset }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.latest_go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.latest_go }}

      - name: Cross-compile for subset ${{ matrix.subset }}
        run: |
          mkdir build-output build-output-debug
          go run ./helpers/build-release-binaries/main.go -o build-output -s . --platform-subset ${{ matrix.subset }}
          go run ./helpers/build-release-binaries/main.go -o build-output-debug -s . --platform-subset ${{ matrix.subset }} --tags debug

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # allow annotating code in the PR
      checks: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.latest_go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.latest_go }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
          version: v2.13
          args: --verbose --timeout 5m --max-issues-per-linter=0 --max-same-issues=0

      - name: Check go.mod/go.sum
        run: |
          echo "check if go.mod and go.sum are up to date"
          go mod tidy
          git diff --exit-code go.mod go.sum

  analyze:
    name: Analyze results
    needs: [test, cross_compile, lint]
    if: always()

    permissions: # no need to access code
      contents: none

    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          jobs: ${{ toJSON(needs) }}

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            otuschhoff/vaultic
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          file: docker/Dockerfile
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
