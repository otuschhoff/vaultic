syntax = "proto3";

package vaulticdb.v1;

option go_package = "github.com/otuschhoff/vaultic/internal/index/proto/vaulticdbv1;vaulticdbv1";

message RequestContext {
  string request_id = 1;
  int64 deadline_unix_ms = 2;
}

message Empty {
  RequestContext context = 1;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  // Set when the error applies to a specific request or state field.
  string field = 4;
  // Set when the error identifies an observed repository generation.
  uint64 generation = 5;
}

message BatchLimits {
  uint32 max_items = 1;
  uint32 max_bytes = 2;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message GetRequest {
  RequestContext context = 1;
  bytes key = 2;
  string transaction_id = 3;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  bytes key = 3;
}

message MultiGetRequest {
  RequestContext context = 1;
  repeated bytes keys = 2;
  string transaction_id = 3;
}

message MultiGetResponse {
  repeated GetResponse results = 1;
}

message WriteBatchRequest {
  RequestContext context = 1;
  repeated KeyValue puts = 2;
  repeated bytes deletes = 3;
  bool await_durable = 4;
  string transaction_id = 5;
  string idempotency_key = 6;
}

message WriteBatchResponse {
  bool durable = 1;
  DurabilityToken durability_token = 2;
}

message DurabilityToken {
  uint64 repository_generation = 1;
  uint64 writer_epoch = 2;
  uint64 applied_sequence = 3;
}

message AwaitDurableThroughRequest {
  RequestContext context = 1;
  DurabilityToken token = 2;
}

message AwaitDurableThroughResponse {
  DurabilityToken durable_through = 1;
}

message ScanRequest {
  RequestContext context = 1;
  bytes prefix = 2;
  uint32 page_size = 3;
  bytes after_key = 4;
  string transaction_id = 5;
}

message ScanResponse {
  repeated KeyValue entries = 1;
  bool done = 2;
  uint64 iterator_setup_ns = 3;
  uint64 iterator_service_ns = 4;
}

message TransactionRequest {
  RequestContext context = 1;
  string transaction_id = 2;
  string idempotency_key = 3;
  bool defer_durability = 4;
  bool require_durability_token = 5;
}

message BeginResponse {
  string transaction_id = 1;
}

message CommitResponse {
  bool durable = 1;
  DurabilityToken durability_token = 2;
}

message HealthRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message HealthResponse {
  string daemon_id = 1;
  string protocol_version = 2;
  string schema_version = 3;
  string repository_id = 4;
  string slate_db_revision = 5;
  bool ready = 6;
  string state = 7;
  string state_detail = 8;
  int64 state_since_unix_ms = 9;
}

message CapabilitiesRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message CapabilitiesResponse {
  string daemon_id = 1;
  string protocol_version = 2;
  string schema_version = 3;
  string repository_id = 4;
  bool unix_socket = 5;
  bool tcp_enabled = 6;
  uint32 max_batch_items = 7;
  uint32 max_message_bytes = 8;
  uint32 max_page_items = 9;
  uint32 max_concurrent_requests = 10;
  bool encryption_enabled = 11;
  string encryption_algorithm = 12;
  uint32 active_dek_version = 13;
  uint64 envelope_generation = 14;
  string unlock_slot = 15;
  bool recovery_unlock = 16;
  bool writer_roles = 17;
  bool durable_idempotency = 18;
  string wal_target = 19;
  string wal_durability = 20;
  bool wal_separate = 21;
  bool wal_encrypted = 22;
  bool wal_replay_ready = 23;
  uint64 wal_uploaded_bytes = 24;
  uint64 wal_outstanding_flushes = 25;
  uint64 wal_durability_failures = 26;
  uint64 wal_last_flush_latency_ms = 27;
  uint64 wal_retained_bytes = 28;
  uint64 wal_retained_segments = 29;
  uint64 wal_oldest_segment_unix_ms = 30;
  uint64 wal_cleanup_failures = 31;
  bool scan_stream = 32;
}

message ReadCacheStatusRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message ReadCacheMetrics {
  uint64 hits = 1;
  uint64 misses = 2;
  uint64 origin_reads = 3;
  uint64 origin_reads_avoided = 4;
  uint64 corruptions = 5;
  uint64 timeouts = 6;
  uint64 failures = 7;
  uint64 bypasses = 8;
  uint64 admissions = 9;
  uint64 admission_rejections = 10;
  uint64 capacity_evictions = 11;
  uint64 idle_evictions = 12;
  uint64 absolute_evictions = 13;
  uint64 corruption_evictions = 14;
  uint64 read_latency_total_us = 15;
  uint64 read_latency_count = 16;
  uint64 write_latency_total_us = 17;
  uint64 write_latency_count = 18;
  uint64 admission_rejections_reservation = 19;
  uint64 admission_rejections_background_budget = 20;
  uint64 admission_rejections_background_task = 21;
  bool admission_rejection_reasons_available = 22;
}

message ReadCacheTierPolicy {
  string tier_id = 1;
  bool enabled = 2;
  uint64 max_bytes = 3;
  uint64 idle_age_ms = 4;
  optional uint64 absolute_age_ms = 5;
  uint32 read_priority = 6;
  uint32 admission_priority = 7;
  uint64 timeout_ms = 8;
}

enum ReadCacheConfidentiality {
  READ_CACHE_CONFIDENTIALITY_UNSPECIFIED = 0;
  READ_CACHE_CONFIDENTIALITY_ENCRYPTED = 1;
  READ_CACHE_CONFIDENTIALITY_DECRYPTED_HIGHLY_TRUSTED = 2;
}

message ReadCacheTierStatus {
  ReadCacheTierPolicy policy = 1;
  uint64 used_bytes = 2;
  uint64 reserved_bytes = 3;
  uint64 pinned_bytes = 4;
  uint64 requested_max_bytes = 5;
  uint64 pending_reclaim_bytes = 6;
  uint64 reconciliation_lag = 7;
  bool circuit_open = 8;
  ReadCacheMetrics metrics = 9;
  ReadCacheConfidentiality confidentiality = 10;
  uint64 local_used_bytes = 11;
  uint64 local_reserved_bytes = 12;
  optional uint64 deletion_pending_bytes = 13;
}

message ReadCacheStatusResponse {
  uint64 revision = 1;
  string namespace = 2;
  optional uint64 aggregate_max_bytes = 3;
  uint64 used_bytes = 4;
  uint64 reserved_bytes = 5;
  uint64 pinned_bytes = 6;
  uint64 max_inflight_bytes = 7;
  uint64 pending_reclaim_bytes = 8;
  ReadCacheMetrics metrics = 9;
  repeated ReadCacheTierStatus tiers = 10;
  uint64 inflight_bytes = 11;
  bool quota_coordination_healthy = 12;
  uint64 quota_ledger_revision = 13;
  uint64 quota_lease_expiry_unix_ms = 14;
  uint64 unverified_stale_bytes = 15;
  uint64 quota_reconciliation_lag = 16;
  uint64 local_used_bytes = 17;
  uint64 local_reserved_bytes = 18;
  uint64 policy_sync_lag = 19;
  string policy_sync_error = 20;
  optional uint64 deletion_pending_bytes = 21;
}

message UpdateReadCachePolicyRequest {
  string repository_id = 1;
  RequestContext context = 2;
  uint64 expected_revision = 3;
  repeated ReadCacheTierPolicy tiers = 4;
}

enum WriterRole {
  WRITER_ROLE_UNSPECIFIED = 0;
  WRITER_ROLE_READ_ONLY = 1;
  WRITER_ROLE_PROMOTING = 2;
  WRITER_ROLE_READ_WRITE = 3;
  WRITER_ROLE_DEMOTING = 4;
  WRITER_ROLE_FENCED = 5;
}

message WriterStatusRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message WriterStatusResponse {
  string instance_id = 1;
  WriterRole role = 2;
  uint64 current_epoch = 3;
  uint64 observed_epoch = 4;
  string transition_reason = 5;
  int64 transition_unix_ms = 6;
  uint64 active_write_intents = 7;
  uint64 active_transactions = 8;
  uint64 last_durable_sequence = 9;
  int64 idle_deadline_unix_ms = 10;
  bool promotion_safe = 11;
  AttributionSnapshot attribution = 12;
  int64 process_started_unix_ms = 13;
  int64 captured_unix_ms = 14;
  uint64 process_cpu_user_us = 15;
  uint64 process_cpu_system_us = 16;
  uint64 process_rss_bytes = 17;
  uint64 process_threads = 18;
  uint64 process_read_bytes = 19;
  uint64 process_write_bytes = 20;
  bool process_cpu_available = 21;
  bool process_memory_available = 22;
  bool process_io_available = 23;
  uint64 engine_flush_interval_ms = 24;
  uint64 engine_max_unflushed_bytes = 25;
  uint64 engine_l0_sst_size_bytes = 26;
  bool engine_tuning_available = 27;
  uint64 engine_block_cache_bytes = 28;
  uint64 engine_meta_cache_bytes = 29;
}

message TimingSnapshot {
  uint64 attempts = 1;
  uint64 failures = 2;
  uint64 total_us = 3;
  uint64 max_us = 4;
  uint64 completed = 5;
  uint64 successes = 6;
  uint64 cancellations = 7;
  uint64 timeouts = 8;
  uint64 active = 9;
  uint64 oldest_active_us = 10;
  repeated uint64 latency_bucket_upper_us = 11;
  repeated uint64 latency_bucket_counts = 12;
  bool contention_available = 13;
  uint64 contentions = 14;
  uint64 active_overflow = 15;
}

message ObjectOperationSnapshot {
  TimingSnapshot timing = 1;
  uint64 transferred_bytes = 2;
  bool transferred_bytes_available = 3;
  bool timeout_outcomes_available = 4;
}

message ObjectStoreRoleSnapshot {
  ObjectOperationSnapshot put = 1;
  ObjectOperationSnapshot multipart_init = 2;
  ObjectOperationSnapshot multipart_part = 3;
  ObjectOperationSnapshot multipart_complete = 4;
  ObjectOperationSnapshot multipart_abort = 5;
  ObjectOperationSnapshot get = 6;
  ObjectOperationSnapshot head = 7;
  ObjectOperationSnapshot get_body = 8;
  ObjectOperationSnapshot get_ranges = 9;
  ObjectOperationSnapshot delete = 10;
  ObjectOperationSnapshot list = 11;
  ObjectOperationSnapshot list_with_offset = 12;
  ObjectOperationSnapshot list_with_delimiter = 13;
  ObjectOperationSnapshot copy = 14;
  ObjectOperationSnapshot rename = 15;
  bool retry_delay_available = 16;
  bool background_pressure_available = 17;
}

message AttributionSnapshot {
  TimingSnapshot admission_wait = 1;
  TimingSnapshot fence_check = 2;
  TimingSnapshot write_batch_request = 3;
  TimingSnapshot begin_request = 4;
  TimingSnapshot commit_request = 5;
  TimingSnapshot rollback_request = 6;
  TimingSnapshot transaction_begin = 7;
  TimingSnapshot engine_submit = 8;
  TimingSnapshot durable_wait = 9;
  TimingSnapshot finalization = 10;
  uint64 engine_write_batches = 11;
  uint64 engine_write_ops = 12;
  uint64 engine_backpressure_count = 13;
  uint64 engine_immutable_memtable_flushes = 14;
  uint64 engine_memtable_bytes = 15;
  uint64 engine_l0_sst_count = 16;
  uint64 engine_sst_count = 17;
  uint64 engine_sorted_run_count = 18;
  uint64 engine_l0_flush_bytes = 19;
  uint64 engine_compacted_bytes = 20;
  uint64 engine_compacted_ssts = 21;
  uint64 engine_running_compactions = 22;
  uint64 engine_l0_stalls_sst_count = 23;
  uint64 engine_l0_stalls_ssts_per_key = 24;
  uint64 engine_memtable_write_bytes = 25;
  uint64 engine_wal_flush_bytes = 26;
  TimingSnapshot admission_lock_hold = 27;
  TimingSnapshot engine_backpressure = 28;
  uint64 engine_batch_write_queue_depth = 29;
  TimingSnapshot engine_batch_write_queue = 30;
  TimingSnapshot engine_batch_write_service = 31;
  ObjectStoreRoleSnapshot object_store_main = 32;
  ObjectStoreRoleSnapshot object_store_wal = 33;
  ObjectStoreRoleSnapshot object_store_coordination = 34;
  TimingSnapshot transaction_map_lock_wait = 35;
  TimingSnapshot transaction_slot_lock_wait = 36;
  uint64 engine_get_keys = 37;
  uint64 engine_filter_point_positives = 38;
  uint64 engine_filter_point_negatives = 39;
  uint64 engine_filter_point_false_positives = 40;
  bool engine_read_metrics_available = 41;
  uint64 engine_multi_get_calls = 42;
  uint64 engine_multi_get_input_keys = 43;
  uint64 engine_multi_get_unique_keys = 44;
  uint64 engine_multi_get_sst_visits = 45;
  uint64 engine_multi_get_candidate_keys = 46;
  uint64 engine_multi_get_needed_blocks = 47;
  uint64 engine_multi_get_coalesced_reads = 48;
  uint64 engine_multi_get_needed_block_bytes = 49;
  uint64 engine_multi_get_coalesced_read_bytes = 50;
  uint64 engine_multi_get_projected_reads_gap_8 = 51;
  uint64 engine_multi_get_projected_read_bytes_gap_8 = 52;
  uint64 engine_multi_get_projected_reads_gap_32 = 53;
  uint64 engine_multi_get_projected_read_bytes_gap_32 = 54;
  uint64 engine_multi_get_projected_reads_gap_128 = 55;
  uint64 engine_multi_get_projected_read_bytes_gap_128 = 56;
  bool engine_multi_get_metrics_available = 57;
}

message DemoteWriterRequest {
  string repository_id = 1;
  RequestContext context = 2;
  bool force = 3;
  uint64 timeout_ms = 4;
  string reason = 5;
}

message PromoteWriterRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string reason = 3;
  bool force_takeover = 4;
  uint64 expected_active_epoch = 5;
}

message GenerationStatusRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message GenerationStatusResponse {
  string repository_id = 1;
  uint64 decision = 2;
  uint64 active_generation = 3;
  string namespace = 4;
  uint64 previous_generation = 5;
  string previous_namespace = 6;
  string state = 7;
  string report_sha256 = 8;
  int64 decided_at_unix_ms = 9;
  int64 observation_until_unix_ms = 10;
  uint64 retired_generation = 11;
  bool destructive_maintenance_allowed = 12;
}

message ActivateGenerationRequest {
  string repository_id = 1;
  RequestContext context = 2;
  uint64 expected_active_generation = 3;
  uint64 candidate_generation = 4;
  string candidate_namespace = 5;
  string report_sha256 = 6;
  uint64 observation_window_ms = 7;
  bool approve = 8;
}

message QuarantineGenerationRequest {
  string repository_id = 1;
  RequestContext context = 2;
  uint64 expected_active_generation = 3;
  string diagnostic_sha256 = 4;
  bool healing_required = 5;
}

message VerifyGenerationRequest {
  string repository_id = 1;
  RequestContext context = 2;
  uint64 expected_decision = 3;
  string report_sha256 = 4;
  bool post_activation_check_clean = 5;
}

message RollbackGenerationRequest {
  string repository_id = 1;
  RequestContext context = 2;
  uint64 expected_decision = 3;
  string report_sha256 = 4;
  uint64 observation_window_ms = 5;
  bool acknowledge = 6;
}

message RetireGenerationRequest {
  string repository_id = 1;
  RequestContext context = 2;
  uint64 expected_decision = 3;
  uint64 generation = 4;
  string report_sha256 = 5;
  bool acknowledge = 6;
}

message MasterKeyRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message MasterKeyResponse {
  bool found = 1;
  bytes master_key = 2;
}

message StoreMasterKeyRequest {
  string repository_id = 1;
  RequestContext context = 2;
  bytes master_key = 3;
}

message KeyStatusRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message KeySlotInfo {
  string id = 1;
  string provider = 2;
  uint32 priority = 3;
  bool recovery = 4;
  string key_reference = 5;
  uint32 dek_version = 6;
}

message KeyStatusResponse {
  uint64 envelope_generation = 1;
  uint32 active_dek_version = 2;
  repeated KeySlotInfo slots = 3;
  string pending_capsule_migration_sha256 = 4;
  string finalized_capsule_migration_sha256 = 5;
}

message AddLocalKeySlotRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string slot_id = 3;
  bytes passphrase = 4;
  uint32 priority = 5;
  bool recovery = 6;
}

message AddCloudKeySlotRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string slot_id = 3;
  string provider = 4;
  string key_reference = 5;
  bytes bearer_token = 6;
  uint32 priority = 7;
}

message RemoveKeySlotRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string slot_id = 3;
}

message RotateLocalKeySlotRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string slot_id = 3;
  bytes passphrase = 4;
}

message RotateDekRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message RewriteDekRequest {
  string repository_id = 1;
  RequestContext context = 2;
  uint32 max_objects = 3;
}

message RewriteDekResponse {
  uint64 rewritten = 1;
  uint64 remaining = 2;
}

message EscrowMasterKeyRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string escrow_id = 3;
  string provider = 4;
  string key_reference = 5;
  bytes bearer_token = 6;
}

message EscrowMasterKeyResponse {
  bytes record = 1;
}

message ExportKeyEnvelopeResponse {
  bytes envelope = 1;
  uint64 generation = 2;
}

message EncryptionAuditResponse {
  uint64 objects = 1;
  uint64 invalid_objects = 2;
  uint64 plaintext_objects = 3;
  uint64 old_version_objects = 4;
  uint64 envelope_generation = 5;
  uint32 active_dek_version = 6;
  string algorithm = 7;
  bool enabled = 8;
}

message RecoverEscrowRequest {
  string repository_id = 1;
  RequestContext context = 2;
  bytes record = 3;
  bytes bearer_token = 4;
}

message OfflineCapsuleMember {
  string member_id = 1;
  string provider = 2;
  bytes credential = 3;
}

message PrepareCapsuleMigrationRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string capsule_directory = 3;
  uint64 generation = 4;
  string group_id = 5;
  uint32 threshold = 6;
  bytes broker_identity_public_key = 7;
  repeated OfflineCapsuleMember members = 8;
  bytes sealed_topology = 9;
}

message PrepareCapsuleMigrationResponse {
  uint64 generation = 1;
  string local_path = 2;
  string mirror_path = 3;
  string capsule_sha256 = 4;
  bytes capsule = 5;
}

message FinalizeCapsuleMigrationRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string capsule_sha256 = 3;
  bytes broker_key_proof = 4;
}

message PublishCapsuleMutationRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string capsule_directory = 3;
  bytes capsule = 4;
  string capsule_sha256 = 5;
  bool identity_recovery = 6;
}

message PublishCapsuleMutationResponse {
  uint64 generation = 1;
  string local_path = 2;
  string mirror_path = 3;
  string capsule_sha256 = 4;
}

service VaulticDB {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc CacheStatus(ReadCacheStatusRequest) returns (ReadCacheStatusResponse);
  rpc UpdateCachePolicy(UpdateReadCachePolicyRequest) returns (ReadCacheStatusResponse);
  rpc WriterStatus(WriterStatusRequest) returns (WriterStatusResponse);
  rpc DemoteWriter(DemoteWriterRequest) returns (WriterStatusResponse);
  rpc PromoteWriter(PromoteWriterRequest) returns (WriterStatusResponse);
  rpc GenerationStatus(GenerationStatusRequest) returns (GenerationStatusResponse);
  rpc QuarantineGeneration(QuarantineGenerationRequest) returns (GenerationStatusResponse);
  rpc ActivateGeneration(ActivateGenerationRequest) returns (GenerationStatusResponse);
  rpc VerifyGeneration(VerifyGenerationRequest) returns (GenerationStatusResponse);
  rpc RollbackGeneration(RollbackGenerationRequest) returns (GenerationStatusResponse);
  rpc RetireGeneration(RetireGenerationRequest) returns (GenerationStatusResponse);
  rpc Drain(Empty) returns (Empty);
  rpc Shutdown(Empty) returns (Empty);
  rpc Get(GetRequest) returns (GetResponse);
  rpc MultiGet(MultiGetRequest) returns (MultiGetResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc ScanStream(ScanRequest) returns (stream ScanResponse);
  rpc WriteBatch(WriteBatchRequest) returns (WriteBatchResponse);
  rpc AwaitDurableThrough(AwaitDurableThroughRequest) returns (AwaitDurableThroughResponse);
  rpc Begin(Empty) returns (BeginResponse);
  rpc Commit(TransactionRequest) returns (CommitResponse);
  rpc Rollback(TransactionRequest) returns (Empty);
  rpc GetMasterKey(MasterKeyRequest) returns (MasterKeyResponse);
  rpc StoreMasterKey(StoreMasterKeyRequest) returns (Empty);
  rpc KeyStatus(KeyStatusRequest) returns (KeyStatusResponse);
  rpc AddLocalKeySlot(AddLocalKeySlotRequest) returns (KeyStatusResponse);
  rpc AddCloudKeySlot(AddCloudKeySlotRequest) returns (KeyStatusResponse);
  rpc RemoveKeySlot(RemoveKeySlotRequest) returns (KeyStatusResponse);
  rpc RotateLocalKeySlot(RotateLocalKeySlotRequest) returns (KeyStatusResponse);
  rpc RotateDek(RotateDekRequest) returns (KeyStatusResponse);
  rpc RewriteDek(RewriteDekRequest) returns (RewriteDekResponse);
  rpc EscrowMasterKey(EscrowMasterKeyRequest) returns (EscrowMasterKeyResponse);
  rpc RecoverEscrow(RecoverEscrowRequest) returns (MasterKeyResponse);
  rpc ExportKeyEnvelope(KeyStatusRequest) returns (ExportKeyEnvelopeResponse);
  rpc CheckEncryption(KeyStatusRequest) returns (EncryptionAuditResponse);
  rpc PrepareCapsuleMigration(PrepareCapsuleMigrationRequest) returns (PrepareCapsuleMigrationResponse);
  rpc FinalizeCapsuleMigration(FinalizeCapsuleMigrationRequest) returns (Empty);
  rpc PublishCapsuleMutation(PublishCapsuleMutationRequest) returns (PublishCapsuleMutationResponse);
}
