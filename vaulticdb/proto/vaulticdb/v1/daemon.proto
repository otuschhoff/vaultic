syntax = "proto3";

package vaulticdb.v1;

option go_package = "github.com/otuschhoff/vaultic/internal/index/proto/vaulticdbv1;vaulticdbv1";

message RequestContext {
  string request_id = 1;
  int64 deadline_unix_ms = 2;
}

message Empty {
  RequestContext context = 1;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message BatchLimits {
  uint32 max_items = 1;
  uint32 max_bytes = 2;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message GetRequest {
  RequestContext context = 1;
  bytes key = 2;
  string transaction_id = 3;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  bytes key = 3;
}

message MultiGetRequest {
  RequestContext context = 1;
  repeated bytes keys = 2;
  string transaction_id = 3;
}

message MultiGetResponse {
  repeated GetResponse results = 1;
}

message WriteBatchRequest {
  RequestContext context = 1;
  repeated KeyValue puts = 2;
  repeated bytes deletes = 3;
  bool await_durable = 4;
  string transaction_id = 5;
}

message WriteBatchResponse {
  bool durable = 1;
}

message ScanRequest {
  RequestContext context = 1;
  bytes prefix = 2;
  uint32 page_size = 3;
  bytes after_key = 4;
  string transaction_id = 5;
}

message ScanResponse {
  repeated KeyValue entries = 1;
  bool done = 2;
}

message TransactionRequest {
  RequestContext context = 1;
  string transaction_id = 2;
}

message BeginResponse {
  string transaction_id = 1;
}

message CommitResponse {
  bool durable = 1;
}

message HealthRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message HealthResponse {
  string daemon_id = 1;
  string protocol_version = 2;
  string schema_version = 3;
  string repository_id = 4;
  string slate_db_revision = 5;
  bool ready = 6;
}

message CapabilitiesRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message CapabilitiesResponse {
  string daemon_id = 1;
  string protocol_version = 2;
  string schema_version = 3;
  string repository_id = 4;
  bool unix_socket = 5;
  bool tcp_enabled = 6;
  uint32 max_batch_items = 7;
  uint32 max_message_bytes = 8;
  uint32 max_page_items = 9;
  uint32 max_concurrent_requests = 10;
  bool encryption_enabled = 11;
  string encryption_algorithm = 12;
  uint32 active_dek_version = 13;
  uint64 envelope_generation = 14;
  string unlock_slot = 15;
  bool recovery_unlock = 16;
}

message MasterKeyRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message MasterKeyResponse {
  bool found = 1;
  bytes master_key = 2;
}

message StoreMasterKeyRequest {
  string repository_id = 1;
  RequestContext context = 2;
  bytes master_key = 3;
}

message KeyStatusRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message KeySlotInfo {
  string id = 1;
  string provider = 2;
  uint32 priority = 3;
  bool recovery = 4;
  string key_reference = 5;
  uint32 dek_version = 6;
}

message KeyStatusResponse {
  uint64 envelope_generation = 1;
  uint32 active_dek_version = 2;
  repeated KeySlotInfo slots = 3;
}

message AddLocalKeySlotRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string slot_id = 3;
  bytes passphrase = 4;
  uint32 priority = 5;
  bool recovery = 6;
}

message AddCloudKeySlotRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string slot_id = 3;
  string provider = 4;
  string key_reference = 5;
  bytes bearer_token = 6;
  uint32 priority = 7;
}

message RemoveKeySlotRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string slot_id = 3;
}

message RotateLocalKeySlotRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string slot_id = 3;
  bytes passphrase = 4;
}

message RotateDekRequest {
  string repository_id = 1;
  RequestContext context = 2;
}

message RewriteDekRequest {
  string repository_id = 1;
  RequestContext context = 2;
  uint32 max_objects = 3;
}

message RewriteDekResponse {
  uint64 rewritten = 1;
  uint64 remaining = 2;
}

message EscrowMasterKeyRequest {
  string repository_id = 1;
  RequestContext context = 2;
  string escrow_id = 3;
  string provider = 4;
  string key_reference = 5;
  bytes bearer_token = 6;
}

message EscrowMasterKeyResponse {
  bytes record = 1;
}

message ExportKeyEnvelopeResponse {
  bytes envelope = 1;
  uint64 generation = 2;
}

message EncryptionAuditResponse {
  uint64 objects = 1;
  uint64 invalid_objects = 2;
  uint64 plaintext_objects = 3;
  uint64 old_version_objects = 4;
  uint64 envelope_generation = 5;
  uint32 active_dek_version = 6;
  string algorithm = 7;
  bool enabled = 8;
}

message RecoverEscrowRequest {
  string repository_id = 1;
  RequestContext context = 2;
  bytes record = 3;
  bytes bearer_token = 4;
}

service VaulticDB {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc Drain(Empty) returns (Empty);
  rpc Shutdown(Empty) returns (Empty);
  rpc Get(GetRequest) returns (GetResponse);
  rpc MultiGet(MultiGetRequest) returns (MultiGetResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc WriteBatch(WriteBatchRequest) returns (WriteBatchResponse);
  rpc Begin(Empty) returns (BeginResponse);
  rpc Commit(TransactionRequest) returns (CommitResponse);
  rpc Rollback(TransactionRequest) returns (Empty);
  rpc GetMasterKey(MasterKeyRequest) returns (MasterKeyResponse);
  rpc StoreMasterKey(StoreMasterKeyRequest) returns (Empty);
  rpc KeyStatus(KeyStatusRequest) returns (KeyStatusResponse);
  rpc AddLocalKeySlot(AddLocalKeySlotRequest) returns (KeyStatusResponse);
  rpc AddCloudKeySlot(AddCloudKeySlotRequest) returns (KeyStatusResponse);
  rpc RemoveKeySlot(RemoveKeySlotRequest) returns (KeyStatusResponse);
  rpc RotateLocalKeySlot(RotateLocalKeySlotRequest) returns (KeyStatusResponse);
  rpc RotateDek(RotateDekRequest) returns (KeyStatusResponse);
  rpc RewriteDek(RewriteDekRequest) returns (RewriteDekResponse);
  rpc EscrowMasterKey(EscrowMasterKeyRequest) returns (EscrowMasterKeyResponse);
  rpc RecoverEscrow(RecoverEscrowRequest) returns (MasterKeyResponse);
  rpc ExportKeyEnvelope(KeyStatusRequest) returns (ExportKeyEnvelopeResponse);
  rpc CheckEncryption(KeyStatusRequest) returns (EncryptionAuditResponse);
}
