[package]
name = "vaulticdb"
version = "0.1.8"
edition = "2021"
default-run = "vaulticdb"
publish = false
license = "BSD-2-Clause"
description = "Vaultic SlateDB metadata service"

[features]
default = []
rados = []
test-failpoints = []

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
aws-config = { version = "1.11", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = "1.117"
aws-sdk-sts = "1.114"
base64 = "0.23"
bytes = "1.10"
cryptoki = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
fs2 = "0.4"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
hpke = "0.13"
ipnet = "2.11"
libc = "0.2"
object_store = { version = "0.14", default-features = false, features = ["azure", "gcp"] }
p256 = { version = "0.13", features = ["ecdh"] }
prost = "0.14"
quick-xml = { version = "0.41", features = ["serialize"] }
rand = "0.9"
rand08 = { package = "rand", version = "0.8" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sharks = "0.5"
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "ae07acd4498068d1b9ba799cc9f6c9824e6f6251" }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
url = "2.5"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }

[dependencies.ctap-hid-fido2]
path = "vendor/ctap-hid-fido2"
features = ["linux-native-basic-udev"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[build-dependencies]
toml = "0.8"
tonic-prost-build = "0.14"

[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
