version: "2"
linters:
  # only enable the linters listed below
  default: none
  enable:
    - asciicheck
    # ensure that http response bodies are closed
    - bodyclose
    # restrict imports from other vaultic packages for internal/backend (cache exempt)
    - depguard
    - copyloopvar
    # make sure all errors returned by functions are handled
    - errcheck
    # preserve wrapped error identity for errors.Is/errors.As callers
    - errorlint
    # keep switch statements over enums exhaustive
    - exhaustive
    # prevent production code from growing new panic paths
    - forbidigo
    # track oversized and complex functions while existing debt is baselined in CI
    - funlen
    - gocognit
    - gocyclo
    # examine code and report suspicious constructs, such as Printf calls whose
    # arguments do not align with the format string
    - govet
    # consistent imports
    - importas
    # detect when assignments to existing variables are not used
    - ineffassign
    - lll
    - nestif
    - nolintlint
    # make sure names and comments are used according to the conventions
    - revive
    # run static analysis and find errors
    - staticcheck
    # find unused variables, functions, structs, types, etc.
    - unused
    - contextcheck
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: return an error or document the invariant with a targeted nolint directive
      analyze-types: true
    funlen:
      lines: 120
      statements: 80
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 30
    lll:
      line-length: 160
      tab-width: 4
    nestif:
      min-complexity: 5
    depguard:
      rules:
        # Prevent backend packages from importing the internal/vaultic package to keep the architectural layers intact.
        backend-imports:
          files:
            - "**/internal/backend/**"
            - "!**/internal/backend/test/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/otuschhoff/vaultic/internal/vaultic"
              desc: "internal/vaultic should not be imported to keep the architectural layers intact"
            - pkg: "github.com/otuschhoff/vaultic/internal/repository"
              desc: "internal/repository should not be imported to keep the architectural layers intact"
        repository-internals:
          files:
            - "**"
            - "!**/internal/repository/**"
          deny:
            - pkg: "github.com/otuschhoff/vaultic/internal/repository/"
              desc: "packages below internal/repository should not be imported to not depend on repository internals"
    importas:
      alias:
        - pkg: github.com/otuschhoff/vaultic/internal/test
          alias: rtest
    staticcheck:
      checks:
        # default
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        # extra disables
        - "-QF1008" # don't warn about specifying name of embedded field on access
  exclusions:
    rules:
      # Phase 2 mechanically moved unchanged declarations into these new files,
      # which makes --new-from-rev classify existing debt as new. Remove paths
      # from this baseline as Phase 3 and Phase 4 modify the corresponding code.
      - path: ^(internal/archiver/archiver_error_test|internal/repository/repository_packs)\.go$
        linters: [contextcheck]
      - path: ^internal/global/(backend|bootstrap)\.go$
        linters: [depguard]
      - path: ^(cmd/vaultic/cmd_index_keys_files|internal/index/daemon/(client_(generation|lifecycle|transaction)_test|client_rpc|schema_store_(gdpr|generation|import|publish|reconcile)))\.go$
        linters: [errcheck]
      - path: ^(cmd/vaultic/cmd_index_keys_files|internal/archiver/archiver_integration_test|internal/repository/repository_(engine|packs))\.go$
        linters: [errorlint]
      - path: ^internal/archiver/archiver_integration_test\.go$
        linters: [forbidigo]
      - path: ^(internal/archiver/archiver_(error|snapshot|tree)_test|internal/global/(backend|bootstrap|options)|internal/index/analytics/(analytics_views_test|engine_(delta|rebuild|views))|internal/index/daemon/(client_(lifecycle|transaction)_test|schema_store_(gdpr|import|publish))|internal/index/schema/keys_parse|internal/restorer/restorer_attributes_test)\.go$
        linters: [funlen]
      - path: ^(internal/archiver/archiver_(error|tree)_test|internal/global/(backend|bootstrap)|internal/index/analytics/(analytics_views_test|engine_(delta|rebuild|views))|internal/index/daemon/(client_(lifecycle|transaction)_test|schema_store_(gdpr|generation|import|publish|reconcile))|internal/index/schema/(keys_parse|records_(inode|snapshot)))\.go$
        linters: [gocognit]
      - path: ^(internal/global/(backend|bootstrap)|internal/index/analytics/(analytics_views_test|engine_(delta|rebuild|views))|internal/index/daemon/(client_(lifecycle|transaction)_test|schema_store_(gdpr|generation|import|publish))|internal/index/schema/keys_parse)\.go$
        linters: [gocyclo]
      - path: ^(cmd/vaultic/cmd_index_keys_files|internal/archiver/archiver_(error|integration)_test|internal/global/(backend|bootstrap|open|options)|internal/index/analytics/(analytics_views_test|engine_(delta|rebuild|views))|internal/index/daemon/(client_(generation|lifecycle|transaction)_test|client_rpc|schema_store_(gdpr|generation|import|publish|reconcile))|internal/index/schema/(keys_parse|records_(inode|snapshot))|internal/repository/repository_(blobs|engine|packs))\.go$
        linters: [lll]
      - path: ^(cmd/vaultic/cmd_index_keys_files|internal/archiver/archiver_tree_test|internal/global/backend|internal/index/analytics/engine_(delta|views)|internal/index/daemon/schema_store_(generation|import|publish|reconcile)|internal/index/schema/records_inode|internal/repository/repository_blobs)\.go$
        linters: [nestif]
      - path: ^(internal/global/bootstrap|internal/repository/repository_blobs)\.go$
        linters: [nolintlint]
      - path: ^(internal/global/backend|internal/index/analytics/engine_delta|internal/index/schema/records_(inode|snapshot))\.go$
        linters: [revive]
      - path: ^(cmd/vaultic/cmd_index_keys_files|internal/index/(daemon/schema_store_publish|schema/records_inode))\.go$
        linters: [staticcheck]
      - path: ^internal/index/(analytics/engine_(delta|rebuild)|daemon/client_generation_test)\.go$
        linters: [unused]
      # revive: ignore unused parameters in tests
      - path: (_test\.go|testing\.go|backend/.*/tests\.go)
        text: "unused-parameter:"
      # revive: do not warn about missing comments for exported stuff
      - path: (.+)\.go$
        text: exported (function|method|var|type|const) .* should have comment or be unexported
      # revive: ignore constants in all caps
      - path: (.+)\.go$
        text: don't use ALL_CAPS in Go names; use CamelCase
      # revive: lots of packages don't have such a comment
      - path: (.+)\.go$
        text: "package-comments: should have a package comment"
      # staticcheck: there's no easy way to replace these packages
      - path: (.+)\.go$
        text: 'SA1019: "golang.org/x/crypto/poly1305" is deprecated'
      - path: (.+)\.go$
        text: 'SA1019: "golang.org/x/crypto/openpgp" is deprecated'
      - path: (.+)\.go$
        text: "redefines-builtin-id:"
      # revive: collection of helpers to implement a backend, more descriptive names would be too repetitive
      - path: internal/backend/util/.*.go$
        text: "var-naming: avoid meaningless package names"
    paths:
      - internal/index/proto/vaulticdb/v1/.*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    # make sure code is formatted
    - gofmt
  exclusions:
    paths:
      - internal/index/proto/vaulticdb/v1/.*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
