version: "2"
linters:
  # only enable the linters listed below
  default: none
  enable:
    - asciicheck
    # ensure that http response bodies are closed
    - bodyclose
    # restrict imports from other vaultic packages for internal/backend (cache exempt)
    - depguard
    - copyloopvar
    # make sure all errors returned by functions are handled
    - errcheck
    # preserve wrapped error identity for errors.Is/errors.As callers
    - errorlint
    # keep switch statements over enums exhaustive
    - exhaustive
    # prevent production code from growing new panic paths
    - forbidigo
    # reject oversized and complex functions, with legacy exceptions documented at their definitions
    - funlen
    - gocognit
    - gocyclo
    # examine code and report suspicious constructs, such as Printf calls whose
    # arguments do not align with the format string
    - govet
    # consistent imports
    - importas
    # detect when assignments to existing variables are not used
    - ineffassign
    - lll
    - nestif
    - nolintlint
    # make sure names and comments are used according to the conventions
    - revive
    # run static analysis and find errors
    - staticcheck
    # find unused variables, functions, structs, types, etc.
    - unused
    - contextcheck
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: return an error or document the invariant with a targeted nolint directive
      analyze-types: true
    funlen:
      lines: 120
      statements: 80
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 30
    lll:
      line-length: 160
      tab-width: 4
    nestif:
      min-complexity: 5
    depguard:
      rules:
        # Prevent backend packages from importing the internal/vaultic package to keep the architectural layers intact.
        backend-imports:
          files:
            - "**/internal/backend/**"
            - "!**/internal/backend/test/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/otuschhoff/vaultic/internal/vaultic"
              desc: "internal/vaultic should not be imported to keep the architectural layers intact"
            - pkg: "github.com/otuschhoff/vaultic/internal/repository"
              desc: "internal/repository should not be imported to keep the architectural layers intact"
        repository-internals:
          files:
            - "**"
            - "!**/internal/repository/**"
            # These layers adapt repository internals to command and index APIs.
            - "!**/internal/global/**"
            - "!**/internal/index/**"
          deny:
            - pkg: "github.com/otuschhoff/vaultic/internal/repository/"
              desc: "packages below internal/repository should not be imported to not depend on repository internals"
    importas:
      alias:
        - pkg: github.com/otuschhoff/vaultic/internal/test
          alias: rtest
    staticcheck:
      checks:
        # default
        - "all"
        - "-ST1003"
        - "-ST1016"
        - "-ST1021"
        - "-ST1022"
        # extra disables
        - "-QF1008" # don't warn about specifying name of embedded field on access
  exclusions:
    rules:
      # Test scaffolding intentionally starts root contexts, exercises partial
      # enum sets, and uses panic to model impossible states.
      - path: _test\.go$
        linters: [contextcheck, exhaustive, forbidigo]
      # Test helpers follow testing.T-first conventions and may use intentionally
      # empty callbacks to assert that an operation performs no work.
      - path: _test\.go$
        text: "^(context-as-argument|empty-block):"
      # Test adapters often implement shared interfaces whose parameters are
      # intentionally unused by a particular test double.
      - path: (_test\.go|testing\.go|backend/.*/tests\.go)
        text: "unused-parameter:"
      # Test cases and reusable backend test suites optimize for scenario
      # readability; production function-size and complexity gates remain strict.
      - path: (_test\.go|testing\.go|internal/backend/test/tests\.go)$
        linters: [funlen, gocognit, gocyclo, nestif]
      # Deferred close/remove failures cannot affect the completed operation;
      # primary operation errors remain authoritative.
      - linters: [errcheck]
        text: "Error return value of `.*(Close|Remove|SetDeadline)"
      # Rollback is best effort after a transaction has already failed, and the
      # original error must not be replaced by rollback failure.
      - linters: [errcheck]
        source: "rollbackTransaction\\("
      # currentBlobSize is a pure repository-configuration lookup; no context
      # can be propagated through it despite contextcheck's call-chain report.
      - linters: [contextcheck]
        source: "currentBlobSize\\("
      # Staticcheck ST1000 and ST1020 are the authoritative documentation
      # checks; suppress revive's overlapping package and declaration reports.
      - path: (.+)\.go$
        text: "^exported:"
      - path: (.+)\.go$
        text: "package-comments: should have a package comment"
      # Split implementations use descriptive receiver names; forcing one
      # single-letter receiver across all files would reduce local clarity.
      - path: (.+)\.go$
        text: "^receiver-naming:"
      # Protocol, environment, and algorithm identifiers retain their standard
      # all-caps spelling instead of being rewritten into unfamiliar Go names.
      - path: (.+)\.go$
        text: don't use ALL_CAPS in Go names; use CamelCase
      # OpenPGP repository compatibility and the legacy Poly1305 construction
      # depend on deprecated x/crypto APIs without drop-in replacements.
      - path: (.+)\.go$
        text: 'SA1019: "golang.org/x/crypto/poly1305" is deprecated'
      - path: (.+)\.go$
        text: 'SA1019: "golang.org/x/crypto/openpgp" is deprecated'
      # DialContext and WithBlock preserve the daemon startup timeout contract;
      # grpc.NewClient connects lazily and is not a behavior-preserving replacement.
      - path: (.+)\.go$
        text: "SA1019: grpc.(DialContext|WithBlock) is deprecated"
      # Multiline corruption diagnostics end with operator guidance and are
      # intentionally presented as complete prose.
      - linters: [staticcheck]
        source: "Corrupted (data|blobs)"
      # Existing domain names such as error and len are part of stable internal
      # APIs; renaming them would add churn without improving correctness.
      - path: (.+)\.go$
        text: "redefines-builtin-id:"
      # This package is intentionally a collection of backend implementation
      # helpers, so the concise util name is more useful than a repeated label.
      - path: internal/backend/util/.*.go$
        text: "var-naming: avoid meaningless package names"
      # Exported helpers inside internal packages may intentionally return
      # package-private implementation types to constrain their use.
      - path: ^internal/.*\.go$
        text: "unexported-return:"
    paths:
      # Generated protobuf bindings are validated from their source schema.
      - internal/index/proto/vaulticdb/v1/.*\.pb\.go$
      # Vendored, standard-library fixture, and example trees are not maintained
      # as first-party production packages by this lint job.
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    # make sure code is formatted
    - gofmt
  exclusions:
    paths:
      # Generated protobuf bindings are formatted by the generator.
      - internal/index/proto/vaulticdb/v1/.*\.pb\.go$
      # Vendored, standard-library fixture, and example trees preserve upstream
      # formatting.
      - third_party$
      - builtin$
      - examples$
